<!DOCTYPE html>
<html>

<head>

    <title>AI Verilog Bug Detector</title>

</head>

<body>

    <h1>🤖 AI Verilog Bug Detector</h1>

    <hr>

    <h3>Upload a Verilog File</h3>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="verilog_file"
            accept=".v"
            required>

        <br><br>

        <button type="submit">
            Analyse
        </button>

    </form>

</body>

</html>
